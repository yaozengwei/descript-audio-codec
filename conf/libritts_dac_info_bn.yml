$include:
  - conf/final/24khz.yml

# Model setup
DACInfoBN.sample_rate: 24000
DACInfoBN.encoder_dim: 64
DACInfoBN.encoder_rates: [2, 4, 5, 8]
DACInfoBN.latent_dim: 64
DACInfoBN.decoder_dim: 1536
DACInfoBN.decoder_rates: [8, 5, 4, 2]
DACInfoBN.max_epsilon: 0.2

# resume: true

lambdas:
  mel/loss: 15.0
  adv/feat_loss: 2.0
  adv/gen_loss: 1.0
  batch_rms/loss: 5.0

# Loss setup
BatchRMSLoss.rms_limit: 1.0

train/build_dataset.folders:
  speech_libritts:
    - download/LibriTTS/train-clean-100
    - download/LibriTTS/train-clean-360
    - download/LibriTTS/train-other-500

val/build_dataset.folders:
  speech_libritts:
    - download/LibriTTS/dev-clean
    - download/LibriTTS/dev-other

test/build_dataset.folders:
  speech_libritts:
    - download/LibriTTS/test-clean
    - download/LibriTTS/test-other
