$include:
  - conf/final/24khz.yml

# Model setup
DACNoWn.sample_rate: 24000
DACNoWn.encoder_dim: 64
DACNoWn.encoder_rates: [2, 4, 5, 8]
DACNoWn.decoder_dim: 1536
DACNoWn.decoder_rates: [8, 5, 4, 2]

# Quantization
DACNoWn.n_codebooks: 32
DACNoWn.codebook_size: 1024
DACNoWn.codebook_dim: 8
DACNoWn.quantizer_dropout: 0.5

# Discriminator
DiscriminatorNoWn.sample_rate: 24000
DiscriminatorNoWn.rates: []
DiscriminatorNoWn.periods: [2, 3, 5, 7, 11]
DiscriminatorNoWn.fft_sizes: [2048, 1024, 512]
DiscriminatorNoWn.bands:
  - [0.0, 0.1]
  - [0.1, 0.25]
  - [0.25, 0.5]
  - [0.5, 0.75]
  - [0.75, 1.0]

# Optimization
generator/ScaledAdam.lr: 0.02
generator/ScaledAdam.clipping_scale: 2.0
generator/ScaledAdam.betas: [0.9, 0.98]
generator/Eden2.lr_batches: 7500
generator/Eden2.warmup_batches: 500
generator/Eden2.warmup_start: 0.1

discriminator/ScaledAdam.lr: 0.03
discriminator/ScaledAdam.clipping_scale: 2.0
discriminator/ScaledAdam.betas: [0.9, 0.98]
discriminator/Eden2.lr_batches: 7500
discriminator/Eden2.warmup_batches: 500
discriminator/Eden2.warmup_start: 0.1

# 1gpu
# batch_size: 256
# val_batch_size: 256
# num_workers: 8
# resume: true
lambdas:
  mel/loss: 15.0
  adv/feat_loss: 2.0
  adv/gen_loss: 1.0
  vq/commitment_loss: 0.25
  vq/codebook_loss: 1.0
  mel_scaled/loss: 5.0

# Loss setup
MelScaledLoss.sample_rate: 24000
MelScaledLoss.n_mels: [5, 10, 20, 40, 80, 160, 320]
MelScaledLoss.window_lengths: [32, 64, 128, 256, 512, 1024, 2048]
MelScaledLoss.eps: 1.0e-7
MelScaledLoss.loss_power: 0.5
MelScaledLoss.mel_fmin: [0, 0, 0, 0, 0, 0, 0]
MelScaledLoss.mel_fmax: [null, null, null, null, null, null, null]

train/build_dataset.folders:
  speech_libritts:
    - download/LibriTTS/train-clean-100
    - download/LibriTTS/train-clean-360
    - download/LibriTTS/train-other-500

val/build_dataset.folders:
  speech_libritts:
    - download/LibriTTS/dev-clean
    - download/LibriTTS/dev-other

test/build_dataset.folders:
  speech_libritts:
    - download/LibriTTS/test-clean
    - download/LibriTTS/test-other
